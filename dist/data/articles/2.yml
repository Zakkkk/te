content: |
  # Solutions to what exactly? {#heading-0}
  You've read the title. Maybe you've got some ideas as to what the title is about, but I'll clear it up for everyone, just in case.
    - Cars make cities look uglier (just Google Paramatta Road and you'll see what I mean.)
    - Cars make public areas less inviting.
    - Cars make it harder to be a pedestrian or relaxed when out in public.
    - Cars are an inherently inefficient method of mass transportation.

  # Self Driving Cars {#heading-1}
  Not only do self driving cars not present a solution to any of the problems, but it arguably worsens them instead.

  Self driving cars are not reliable. Not even the car companies who report on the so claimed safeties are reliable. I would not trust a computer operated 2000kg vehicle to drive near me (much more than I would trust a random person anyway). A small fault will prove fatal to any unprotected human near the car.